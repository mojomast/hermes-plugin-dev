[project]
name = "hermes-plugin-dev"
version = "0.1.0"
description = "Skill + Hermes plugin for building Hermes plugins"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6,<7"]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7,<1"]
dev = ["pytest>=8,<9", "tiktoken>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/hermes-plugin-development/templates/hello-hermes/tests"]
