name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "pyyaml>=6,<7" "pytest>=8,<9" "tiktoken>=0.7,<1"
      - run: pytest -q
      - name: Measure tool schema tokens
        run: python -c "import hpd_core,json;print(json.dumps(hpd_core.measure_schemas(__import__('pathlib').Path('.')),indent=1))"
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
